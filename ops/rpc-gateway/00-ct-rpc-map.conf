# The explorer indexer calls its own public hostname from S1. Keep that
# existing internal dependency on the full private RPC; all other callers
# are sent to the method-limited gateway. The gateway listens on loopback.
map $remote_addr $ct_rpc_target {
    default       127.0.0.1:18741;
    47.111.91.203 172.17.219.139:7401;
    172.17.219.137 172.17.219.139:7401;
}
